<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caracterización de productos</title>
<style>
/* VOICE: institutional, calm, plain Spanish; a working form, not a brochure.
   IDEA: the product's technical sheet (ficha técnica) being filled in as people answer.
   PICTURE: the ficha itself, growing live beside the questions; on phones it follows them.
   COLOUR and TYPE: SIC wine red as the dominant field, white paper, warm grey; Verdana throughout.
   LAYOUT: thin wine header with the six steps; questions left, ficha right; stacked below 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#f6f3f1,#161012);--paper:light-dark(#ffffff,#21181b);--ink:light-dark(#231a1d,#f1e9eb);
--mute:light-dark(#6b5d61,#b9a9ae);--line:light-dark(#e4dcdd,#3a2d31);--wine:light-dark(#7d1d36,#c9566f);
--wine-d:light-dark(#5e1428,#e07d92);--wine-s:light-dark(#f6e8ec,#3a1c25);--ok:light-dark(#2f6b45,#7cc79a);
--ok-s:light-dark(#e7f2ea,#1d3326);--warn:light-dark(#8a5a00,#f0c066);--warn-s:light-dark(#fdf3dc,#3a2d10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Verdana,Geneva,sans-serif;overflow-x:clip}
header{background:var(--wine);color:#fff;padding:22px max(4vw,16px) 0}
header h1{margin:0 0 4px;font-size:clamp(22px,3vw,30px);line-height:1.15;font-weight:700;text-wrap:balance}
header p{margin:0 0 16px;max-width:70ch;opacity:.9;font-size:14px}
nav.steps{display:flex;gap:4px;overflow-x:auto}
nav.steps button{flex:none;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:13px;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;min-height:44px}
nav.steps button[aria-current=step]{background:var(--bg);color:var(--wine-d);font-weight:700}
nav.steps button:disabled{opacity:.45;cursor:default}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;padding:24px max(4vw,16px) 48px;max-width:1320px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,2.5vw,28px)}
h2{font-size:20px;line-height:1.25;margin:0 0 6px;color:var(--wine-d)}
.lead{color:var(--mute);margin:0 0 18px;font-size:14px}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
.hint{font-weight:400;color:var(--mute);font-size:13px;display:block;margin-top:2px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 10px;font-weight:700;font-size:14.5px}
.q small{display:block;font-weight:400;color:var(--mute);margin-top:3px;font-size:13px}
.yn{display:flex;gap:8px;flex-wrap:wrap}
.yn button,.btn{font:inherit;font-size:14px;min-height:44px;padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.yn button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.primary{background:var(--wine);color:#fff;border-color:var(--wine);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.note{border-radius:8px;padding:10px 14px;font-size:13.5px;margin:12px 0}
.note.warn{background:var(--warn-s);color:var(--warn)}
.note.ok{background:var(--ok-s);color:var(--ok)}
.note.info{background:var(--wine-s);color:var(--wine-d)}
.path{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.path span{font-size:12.5px;background:var(--wine-s);color:var(--wine-d);border-radius:20px;padding:4px 10px}
.tree-q{font-size:19px;line-height:1.35;margin:6px 0 18px;font-weight:700}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt input{margin-right:8px;accent-color:var(--wine)}
.opt b{font-size:14.5px}.opt span{display:block;color:var(--mute);font-size:13px;margin:3px 0 0 24px}
.locked{font-size:12.5px;color:var(--ok);font-weight:700;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border-radius:20px;padding:3px 9px;border:1px solid var(--line);color:var(--mute)}
.chips .btn[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.req{margin-top:6px;font-size:12.5px;background:var(--ok-s);color:var(--ok);border-radius:6px;padding:6px 8px}.req .rc{font-weight:700;white-space:nowrap}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
/* ficha */
.ficha{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto}
@media(max-width:900px){.ficha{position:static;max-height:none}}
.ficha h3{margin:0;font-size:18px;line-height:1.3}
.ficha .code{font-size:12px;color:var(--mute);letter-spacing:.02em}
.ficha dl{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:8px 14px;margin:16px 0;font-size:13.5px}
.ficha dt{color:var(--mute)}.ficha dd{margin:0}
.empty{color:var(--mute);font-style:italic}
.badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--wine-s);color:var(--wine-d)}
.badge.ok{background:var(--ok-s);color:var(--ok)}.badge.warn{background:var(--warn-s);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:400;border-bottom:1px solid var(--line);padding:6px 4px}
td{border-bottom:1px solid var(--line);padding:9px 4px;vertical-align:top}
td.n{width:2em;color:var(--mute)}td.w{width:4.5em;text-align:right;white-space:nowrap;font-weight:700}
tr.off td{color:var(--mute)}tr.off td.w{font-weight:400}
tr.new td:nth-child(2){box-shadow:inset 3px 0 0 var(--ok)}
details{margin-top:4px}summary{cursor:pointer;color:var(--wine-d);font-size:12.5px}
details p{margin:6px 0 0;font-size:12.5px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:40px}
.seg button[aria-pressed=true]{background:var(--wine);color:#fff;font-weight:700}
ul.tr{padding-left:18px;margin:8px 0;font-size:13px}ul.tr li{margin:4px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){.ficha dl{grid-template-columns:minmax(0,1fr)}.ficha dt{margin-top:6px}}
</style>
</head>
<body>
<header>
  <h1>Caracterización de productos del Plan de Acción</h1>
  <p>Describa su producto y responda las preguntas. Al final obtendrá su ficha: si va en el plan de acción o en el proceso, su categoría, su naturaleza, los requisitos MIPG que activa y su ruta de hitos con pesos.</p>
  <nav class="steps" id="steps" aria-label="Pasos"></nav>
</header>
<main>
  <section class="card" id="panel" aria-live="polite"></section>
  <aside class="card ficha" id="ficha" aria-label="Ficha del producto"></aside>
</main>

 const cur=document.querySelector('nav.steps [aria-current]');if(cur)$('steps').scrollLeft=cur.offsetLeft-16;
}
function yn(key,val){return `<div class="yn"><button aria-pressed="${val===true}" data-yn="${key}" data-v="1">Sí</button><button aria-pressed="${val===false}" data-yn="${key}" data-v="0">No</button></div>`}
function foot(ok,last){return `<div class="row">${step>0?'<button class="btn" data-go="'+(step-1)+'">Anterior</button>':''}${last?'':'<button class="btn primary" '+(ok?'':'disabled')+' data-go="'+(step+1)+'">Siguiente</button>'}</div>`}

function panel(){
 const P=$('panel');let h='';
 if(step===0){
  const warn=VERBS.test(S.name.trim());
  h=`<h2>Describa el producto</h2><p class="lead">Escríbalo como un resultado que se pueda verificar, no como una actividad. Ejemplo: «Guía de protección de datos para pymes publicada».</p>
  <label for="dep">Dependencia</label><input type="text" id="dep" value="${esc(S.dep)}" autocomplete="organization">
  <label for="name">Nombre del producto<span class="hint">Sustantivo + estado final (publicada, adoptado, en producción, expedida).</span></label><input type="text" id="name" value="${esc(S.name)}">
  <div id="vw">${warn?'<div class="note warn">Empieza con un verbo de actividad. Pregúntese qué queda cuando la actividad termina y nombre eso.</div>':''}</div>
  <label for="del">¿Qué quedará al final que alguien pueda ver, usar o verificar?</label><textarea id="del">${esc(S.del)}</textarea>
  <label for="to">¿Para quién es?<span class="hint">Ciudadanos, empresas, otra entidad, servidores de la SIC, un proceso interno.</span></label><input type="text" id="to" value="${esc(S.to)}">`+foot(done(0));
 }
 if(step===1){
  const Q=[['a','¿Hace parte de un proyecto estratégico, transforma la entidad o es un compromiso temporal que la alta dirección necesita seguir?'],
   ['b','¿Se repite cada año con el mismo alcance y el mismo método?','La frecuencia sola no basta para sacarlo del plan.'],
   ['c','¿Lo exige una norma de forma permanente?','Por ejemplo, un informe o un plan que se presenta cada año.'],
   ['d','¿El proceso ya tiene la capacidad (personas, sistema y procedimiento) para hacerlo sin seguimiento especial?']];
  const p=placement();
  h=`<h2>¿Va en el plan de acción o en la operación del proceso?</h2><p class="lead">El plan de acción es para lo que necesita seguimiento especial. Lo recurrente y estable se gestiona mejor en el proceso.</p>`+
  Q.map(q=>`<div class="q"><p>${q[1]}${q[2]?'<small>'+q[2]+'</small>':''}</p>${yn('op.'+q[0],S.op[q[0]])}</div>`).join('')+
  (p?`<div class="note ${p.k==='proc'?'warn':p.k==='eval'?'info':'ok'}"><b>${p.t}.</b> ${p.d}${p.k==='proc'?' Puede continuar para caracterizarlo y llevar su ruta al procedimiento.':''}</div>`:'')+foot(done(1));
 }
 if(step===2){
  if(S.cat){const c=CAT[S.cat];
   h=`<h2>Categoría</h2><div class="path">${S.path.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
   <div class="note ok"><b>${c.n} · ${esc(c.name)}</b> (${esc(c.g)}). ${esc(c.d)}</div>
   <div class="row"><button class="btn" data-reset-tree>Volver a clasificar</button></div>`+foot(true);
  }else if(S.node==='fuera'){
   h=`<h2>Categoría</h2><div class="path">${S.path.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="note warn"><b>No es un producto del plan de acción.</b> Lo que opera el ciclo de control y mejora se gestiona en el proceso o en el plan de mejoramiento, que tiene su propio instrumento. Si el producto implementa un sistema de gestión nuevo, responda «No» a esa pregunta: se clasifica como modelo (03).</div>
   <div class="row"><button class="btn" data-tree-back>Deshacer</button><button class="btn" data-reset-tree>Clasificar de nuevo</button><button class="btn" data-new>Caracterizar otro producto</button></div>`;
  }else if(S.node==='back'){
   h=`<h2>Categoría</h2><div class="note warn">Ninguna pregunta recibió un «Sí». Suele ocurrir cuando el enunciado describe una actividad. Vuelva al paso 1 y reescríbalo como el resultado que queda.</div>
   <div class="row"><button class="btn primary" data-go="0">Reescribir el enunciado</button><button class="btn" data-reset-tree>Clasificar de nuevo</button></div>`;
  }else{const q=TREE[S.node];
   h=`<h2>Categoría</h2><p class="lead">Responda en orden. La primera respuesta «Sí» decide la categoría.</p><div class="path">${S.path.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
   <p class="tree-q">${q.t}</p><p class="lead">${q.h}</p><div class="yn"><button class="btn primary" data-tree="y">Sí</button><button class="btn" data-tree="n">No</button>${S.path.length?'<button class="btn" data-tree-back>Deshacer</button>':''}</div>`+foot(false);
  }
 }
 if(step===3){const c=CAT[S.cat];const sug=NATMAP[c.nat]??0;
  h=`<h2>Naturaleza de la salida</h2><p class="lead">La categoría sugiere «${esc(c.nat)}». Confírmelo o cámbielo según lo que realmente entrega.</p>`+
  NAT.map((n,i)=>`<label class="opt"><input type="radio" name="nat" value="${i}" ${S.nat===i?'checked':''}><b>${n[0]}</b>${i===sug?' <span class="locked" style="display:inline;margin:0">sugerida</span>':''}<span>${n[1]}</span></label>`).join('')+
  `<div class="note info">Un documento puede ser un producto intermedio. Una actividad no es un servicio por sí misma: puede ser parte del proceso que genera un producto.</div>`+foot(done(3));
 }
 if(step===4){
  h=`<h2>Requisitos MIPG</h2><p class="lead">Cada «Sí» activa requisitos que ya están escritos en los hitos. Los marcados como «siempre» vienen activos por la categoría.</p>`+
  D.acts.map(a=>{const al=ALWAYS[a.c].includes(S.cat);
   let body=al?`<span class="locked">Siempre activo en esta categoría</span>`:'';
   if(!al&&a.c==='INN')body=['a|¿Cambia de forma sustancial un servicio, proceso, producto o política?','b|¿Es nuevo para la SIC, no solo para el área?','c|¿Se probará con prototipo, piloto o experimento antes de adoptarlo?'].map(x=>{const[k,t]=x.split('|');return `<div style="margin:8px 0"><small style="display:block;margin-bottom:6px">${t}</small>${yn('inn.'+k,S.inn[k])}</div>`}).join('');
   else if(!al)body=yn('acts.'+a.c,S.acts[a.c]);
   let extra='';
   if(a.c==='PAR'&&isOn('PAR'))extra=`<div style="margin-top:10px"><small>¿En qué fase incide la ciudadanía?</small><div class="chips">${['Diagnóstico','Formulación','Ejecución','Evaluación'].map(f=>`<button class="btn" style="min-height:36px;padding:4px 12px" aria-pressed="${S.fases.includes(f)}" data-fase="${f}">${S.fases.includes(f)?'✓ ':''}${f}</button>`).join('')}</div></div>`;
   return `<div class="q"><p>${a.c} · ${esc(a.name)}<small>${a.c==='INN'?'Debe cumplir los tres criterios.':esc(a.q)}</small></p>${body}${extra}</div>`}).join('')+foot(done(4));
 }
 if(step===5){
  h=`<h2>Su ficha está lista</h2><p class="lead">Revise la ruta en la ficha. Elija la ruta mínima para productos acotados o la máxima para ejecución completa.</p>
  <div class="seg" role="group" aria-label="Ruta"><button class="btn" aria-pressed="${S.route==='mn'}" data-route="mn">Ruta mínima</button><button class="btn" aria-pressed="${S.route==='mx'}" data-route="mx">Ruta máxima</button></div>
  <div class="row"><button class="btn primary" data-copy="ficha">Copiar ficha</button><button class="btn" data-copy="row">Copiar fila para la plantilla</button><button class="btn" data-new>Caracterizar otro producto</button></div>
  <p class="lead" style="margin-top:18px">Las filas se pegan en Excel con encabezados: Dependencia, Producto, Entregable, Destinatario, Ubicación, Categoría, Naturaleza, CAM, PAR, Fases PAR, EST, INN, TRA, SEG, Ruta, N.º de hitos.</p>`+foot(true,true);
 }
 P.innerHTML=h;
}

function ficha(){
 const F=$('ficha');const c=S.cat&&CAT[S.cat];const p=placement();
 const on=D.acts.filter(a=>isOn(a.c));
 let h=`<div class="code">FICHA DE CARACTERIZACIÓN${S.dep?' · '+esc(S.dep).toUpperCase():''}</div>
 <h3>${S.name.trim()?esc(S.name):'<span class="empty">Nombre del producto</span>'}</h3>
 <dl><dt>Entregable</dt><dd>${S.del.trim()?esc(S.del):'<span class="empty">Pendiente</span>'}</dd>
 <dt>Destinatario</dt><dd>${S.to.trim()?esc(S.to):'<span class="empty">Pendiente</span>'}</dd>
 <dt>Ubicación</dt><dd>${p?`<span class="badge ${p.k==='proc'?'warn':p.k==='pa'?'ok':''}">${p.t}</span>`:'<span class="empty">Paso 2</span>'}</dd>
 <dt>Categoría</dt><dd>${c?`<b>${c.n} · ${esc(c.name)}</b><br><span style="color:var(--mute)">${esc(c.g)}</span>`:'<span class="empty">Paso 3</span>'}</dd>
 <dt>Naturaleza</dt><dd>${S.nat!==null?NAT[S.nat][0]:'<span class="empty">Paso 4</span>'}</dd>`;
 if(c)h+=`<dt>Resultado tipo</dt><dd>${esc(c.res)}</dd><dt>Medición</dt><dd>${esc(c.med)}${D.ayuda[c.n]?`<details><summary>¿Cómo se mide?</summary><p>${esc(D.ayuda[c.n]).replace(/\n/g,'<br>')}</p></details>`:''}</dd><dt>Evidencia</dt><dd>${esc(c.ev)}</dd>`;
 h+=`<dt>Requisitos MIPG</dt><dd>${c&&done(4)?(on.length?on.map(a=>`<span class="chip on">${a.c} · ${esc(a.name)}</span>`).join(' '):'Ninguno adicional')+(isOn('PAR')&&S.fases.length?`<br><small style="color:var(--mute)">Fases: ${S.fases.join(', ')}</small>`:''):'<span class="empty">Paso 5</span>'}</dd></dl>`;
 if(c){const k=S.route;
  h+=`<b style="font-size:14px">Ruta de hitos · ${k==='mn'?'mínima':'máxima'}</b><table><thead><tr><th>N.º</th><th>Hito y requisitos</th><th style="text-align:right">Peso</th></tr></thead><tbody>`+
  c.hitos.map((x,i)=>{const w=x[k];const ac=x.codes.filter(isOn);
   return `<tr class="${w?'':'off'}"><td class="n">${i+1}</td><td>${esc(x.t)}${reqOn(x)?`<div class="req"><b>MIPG:</b> ${esc(x.req)}${ac.length?' <span class="rc">'+ac.join(' · ')+'</span>':''}</div>`:''}</td><td class="w">${w?w+' %':'—'}</td></tr>`}).join('')+
  `</tbody></table><p style="font-size:12.5px;color:var(--mute)">«—» = el hito no pondera en la ruta elegida. «MIPG» = requisito que se suma al hito para este producto; los que no aplican no se muestran.</p>
  <b style="font-size:14px">Siempre, en todos los productos</b><ul class="tr">${D.tr.map(t=>`<li><b>${esc(t.n)}:</b> ${esc(t.t)}</li>`).join('')}</ul>`;
 }
 F.innerHTML=h;
}
function rowOf(){const c=CAT[S.cat],p=placement();const yn=x=>isOn(x)?'Sí':'No';
 return [S.dep,S.name,S.del,S.to,p?p.t:'',c?c.n+' · '+c.name:'',S.nat!==null?NAT[S.nat][0]:'',yn('CAM'),yn('PAR'),S.fases.join(', '),yn('EST'),yn('INN'),yn('TRA'),yn('SEG'),S.route==='mn'?'Mínima':'Máxima',c?c.hitos.filter(x=>x[S.route]).length:''].map(v=>String(v).replace(/[\t\n]+/g,' '));}
function fichaText(){const c=CAT[S.cat],p=placement();
 let t=`FICHA DE CARACTERIZACIÓN\nDependencia: ${S.dep}\nProducto: ${S.name}\nEntregable: ${S.del}\nDestinatario: ${S.to}\nUbicación: ${p?p.t:''}\nCategoría: ${c.n} · ${c.name} (${c.g})\nNaturaleza: ${NAT[S.nat][0]}\nMedición: ${c.med}\nRequisitos MIPG activos: ${D.acts.filter(a=>isOn(a.c)).map(a=>a.c+' '+a.name).join('; ')||'ninguno adicional'}${S.fases.length&&isOn('PAR')?' (fases: '+S.fases.join(', ')+')':''}\n\nRuta ${S.route==='mn'?'mínima':'máxima'}:\n`;
 c.hitos.forEach((x,i)=>{const w=x[S.route];if(w)t+=`${i+1}. ${x.t} — ${w} %\n${reqOn(x)?'   MIPG: '+x.req+'\n':''}`});
 t+=`\nReglas para todos los productos:\n`+D.tr.map(r=>`- ${r.n}: ${r.t}`).join('\n');
 return t;}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){toast('No se pudo copiar: seleccione el texto de la ficha')}}

function render(){nav();panel();ficha();keep()}
document.addEventListener('input',e=>{const id=e.target.id;if(['dep','name','del','to'].includes(id)){S[id]=e.target.value;
 if(id==='name')$('vw').innerHTML=VERBS.test(S.name.trim())?'<div class="note warn">Empieza con un verbo de actividad. Pregúntese qué queda cuando la actividad termina y nombre eso.</div>':'';
 nav();ficha();keep();const b=document.querySelector('.row .primary');if(b)b.disabled=!done(0)}});
document.addEventListener('change',e=>{if(e.target.name==='nat'){S.nat=+e.target.value;render()}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go!==undefined){const g=+d.go;if(g<=step||reach(g)){step=g;render();window.scrollTo({top:0})}return}
 if(d.yn){const[o,k]=d.yn.split('.');S[o][k]=d.v==='1';if(o==='acts'&&k==='PAR'&&!S.acts.PAR)S.fases=[];render();return}
 if(d.tree){const q=TREE[S.node];S.path.push(q.t.replace(/^¿|\?$/g,'')+': '+(d.tree==='y'?'Sí':'No'));S.hist=(S.hist||[]).concat(S.node);const nx=d.tree==='y'?q.y:q.n;
  if(/^\d/.test(nx)){S.cat=nx;S.nat=null;S.acts={};S.inn={};S.fases=[]}else S.node=nx;render();return}
 if(d.treeBack!==undefined){S.path.pop();S.node=(S.hist||['q1']).pop()||'q1';render();return}
 if(d.resetTree!==undefined){S.cat=null;S.node='q1';S.path=[];S.hist=[];S.nat=null;render();return}
 if(d.fase){S.fases=S.fases.includes(d.fase)?S.fases.filter(x=>x!==d.fase):S.fases.concat(d.fase);render();return}
 if(d.route){S.route=d.route;render();return}
 if(d.copy==='ficha')return copy(fichaText());
 if(d.copy==='row')return copy(rowOf().join('\t'));
 if(d.new!==undefined){S=blank();step=0;render();window.scrollTo({top:0});return}
});
render();
}
</script>
</body>
</html>
